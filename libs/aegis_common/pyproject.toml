[project]
name = "aegis-common"
version = "0.1.0"
description = "Configuración, logging estructurado y utilidades AWS compartidas por los servicios de AegisVolt"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.40,<2",
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.10,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_common"]
