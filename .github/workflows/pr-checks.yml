# Checks obligatorios de todo PR hacia dev, test o prod.
# Los `name:` de los jobs son EXACTAMENTE los del ruleset (T6). Si cambias uno aquí,
# cámbialo en .github/rulesets/protected-branches.json o el merge queda bloqueado.
name: pr-checks

on:
  pull_request: # NUNCA pull_request_target: daría secretos/escritura al código de un fork (T3)
    branches: [dev, test, prod]

permissions:
  contents: read # mínimo; cada job pide solo lo que necesita

concurrency: # un push nuevo al PR cancela la corrida anterior
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.8"
  PYTHON_VERSION: "3.12"

jobs:
  lint-build:
    name: lint-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with: { version: "${{ env.UV_VERSION }}", python-version: "${{ env.PYTHON_VERSION }}" }
      - run: uv sync --all-packages --frozen
      - name: Ruff (lint + formato)
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with: { terraform_version: 1.16.6 }
      - name: Terraform fmt + validate
        run: |
          terraform fmt -check -recursive infra
          for dir in infra/bootstrap infra/envs; do
            terraform -chdir=$dir init -backend=false -input=false >/dev/null
            terraform -chdir=$dir validate
          done
      - name: Kustomize (los 3 overlays renderizan)
        run: for env in dev test prod; do kubectl kustomize k8s/overlays/$env >/dev/null; done
      - name: Build de las 5 imágenes
        run: |
          for svc in station-reservation-service billing-wallet-service \
                     energy-dispatch-service graphql-gateway; do
            docker build -q -f services/$svc/Dockerfile -t aegisvolt/$svc:ci .
          done
          docker build -q -t aegisvolt/frontend:ci frontend # incluye tsc (tipos) + vite build

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with: { version: "${{ env.UV_VERSION }}", python-version: "${{ env.PYTHON_VERSION }}" }
      - run: uv sync --all-packages --frozen
      - name: pytest (sin Floci)
        # Un proceso por servicio: cada uno tiene su paquete `app` y chocarían en el mismo proceso.
        run: |
          uv run pytest tests/unit -q -p no:cacheprovider
          for svc in services/*/; do
            uv run pytest "$svc" -m "not integration and not e2e" -q -p no:cacheprovider
          done

  integration-tests:
    name: integration-tests
    runs-on: ubuntu-latest
    env: { AEGIS_STRICT_SKIPS: "1" } # un skip aquí es un error
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with: { version: "${{ env.UV_VERSION }}", python-version: "${{ env.PYTHON_VERSION }}" }
      - run: uv sync --all-packages --frozen
      - uses: ./.github/actions/floci-stack
      - name: pytest -m integration (DynamoDB real en Floci)
        run: |
          for svc in services/*/; do
            uv run pytest "$svc" -m integration -q -p no:cacheprovider
          done

  e2e-tests:
    name: e2e-tests
    runs-on: ubuntu-latest
    env: { AEGIS_STRICT_SKIPS: "1" }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with: { version: "${{ env.UV_VERSION }}", python-version: "${{ env.PYTHON_VERSION }}" }
      - run: uv sync --all-packages --frozen
      - uses: ./.github/actions/floci-stack
      - name: .env efímero (token aleatorio, credenciales falsas)
        run: |
          cp .env.example .env
          sed -i "s|^ADMIN_TOKEN=.*|ADMIN_TOKEN=$(openssl rand -hex 24)|" .env
      - name: Levantar los 4 servicios y sembrar datos
        run: |
          nohup uv run python scripts/run_services.py > services.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/readyz >/dev/null && break; sleep 1
          done
          uv run python scripts/seed.py
      - name: pytest tests/e2e (SAGA por GraphQL)
        run: uv run pytest tests/e2e -q -p no:cacheprovider
      - name: Logs de los servicios (si falló)
        if: failure()
        run: cat services.log

  terraform-plan:
    name: terraform-plan
    # Self-hosted SOLO para PR desde ramas del propio repo. Un fork cae en ubuntu-latest y
    # falla a propósito: el check existe y queda en rojo (R1), nunca "skipped" = aprobado.
    runs-on: >-
      ${{ github.event.pull_request.head.repo.full_name == github.repository
          && fromJSON('["self-hosted","aegisvolt"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: write # para comentar el plan en el PR
    env:
      WORKSPACE: ${{ github.base_ref }} # PR a test => plan del workspace test
    steps:
      - name: Bloquear forks
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "terraform plan no está permitido desde forks (runner self-hosted protegido)"
          exit 1
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: terraform plan contra el estado REAL de ${{ env.WORKSPACE }} (T1)
        shell: bash
        working-directory: infra/envs
        env: { AWS_ACCESS_KEY_ID: test, AWS_SECRET_ACCESS_KEY: test, AWS_DEFAULT_REGION: us-east-1 }
        run: |
          terraform init -input=false -backend-config=backend-floci.hcl
          terraform workspace select "$WORKSPACE"
          terraform plan -input=false -lock-timeout=60s -var-file=floci.tfvars -out=plan.out
          terraform show -no-color plan.out > plan.txt
          terraform show -json plan.out > plan.json
      - name: Guardia (no destruir otro ambiente, R7)
        shell: bash
        run: uv run --no-project python scripts/plan_guard.py infra/envs/plan.json --workspace "$WORKSPACE"
      - name: Publicar el plan en el PR
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          {
            echo "### terraform plan — workspace \`$WORKSPACE\`"
            echo '```'; grep -E '^(Plan:|No changes)' infra/envs/plan.txt || true; echo '```'
            echo "<details><summary>Plan completo</summary>"; echo
            echo '```hcl'; head -c 60000 infra/envs/plan.txt; echo '```'; echo "</details>"
          } > comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md \
            --edit-last --create-if-none
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terraform-plan-${{ env.WORKSPACE }}
          path: infra/envs/plan.txt

  promote-guard:
    name: promote-guard
    runs-on: ubuntu-latest
    steps:
      - name: Promoción lineal feature/* -> dev -> test -> prod
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          case "$BASE" in
            dev)  [[ "$HEAD" != "test" && "$HEAD" != "prod" ]] || bad=1 ;;
            test) [[ "$HEAD" == "dev" ]] || bad=1 ;;
            prod) [[ "$HEAD" == "test" ]] || bad=1 ;;
          esac
          if [[ -n "${bad:-}" ]]; then
            echo "BLOQUEADO: '$HEAD' -> '$BASE' rompe el orden dev -> test -> prod"; exit 1
          fi
          echo "OK: $HEAD -> $BASE"

  security-scan:
    # Informativo (no está en el ruleset): secretos en el historial + malas configuraciones
    # de IaC (Terraform, manifiestos k8s, Dockerfiles). Se puede volver obligatorio después.
    name: security-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 0 } # gitleaks revisa TODO el historial, no solo el último commit
      - name: gitleaks (secretos)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env: { GITHUB_TOKEN: "${{ github.token }}" }
      - name: Trivy config (IaC + k8s + Dockerfiles)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
