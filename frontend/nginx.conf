# Archivos estáticos del frontend. /graphql NO pasa por aquí: el Ingress lo manda al gateway.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws: wss:; style-src 'self'; script-src 'self'; frame-ancestors 'none'" always;

    # config.js generado al arrancar: nunca en caché (cambia por ambiente).
    location = /config.js {
        alias /usr/share/nginx/html/runtime/config.js;
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # SPA: cualquier ruta desconocida carga index.html.
    location / {
        try_files $uri /index.html;
    }
}
