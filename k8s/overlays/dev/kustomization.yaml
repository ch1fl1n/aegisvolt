# Overlay dev : namespace aegisvolt-dev, AEGIS_ENV=dev, host dev.aegisvolt.local
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: aegisvolt-dev

resources:
  - namespace.yaml
  - ../../base

configMapGenerator:
  - name: aegis-config
    behavior: merge
    literals:
      - AEGIS_ENV=dev

patches:
  - target:
      kind: Ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dev.aegisvolt.local
