# Un namespace por ambiente. Pod Security Admission "restricted": el API server RECHAZA pods
# que corran como root, escalen privilegios o no declaren seccomp.
apiVersion: v1
kind: Namespace
metadata:
  name: aegisvolt-test
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
